version: "3.9"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Indexer workers - scale up with: docker compose up --scale indexer=8
  indexer:
    build: .
    command: python -m workers.indexer_worker
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      FAISS_INDEX_PATH: /data/faiss_index
      INVERTED_INDEX_PATH: /data/inverted_index
    volumes:
      - search_data:/data
    deploy:
      replicas: 4

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      FAISS_INDEX_PATH: /data/faiss_index
      INVERTED_INDEX_PATH: /data/inverted_index
    volumes:
      - search_data:/data
    ports:
      - "8000:8000"

volumes:
  search_data: